<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Thi trắc nghiệm Triết học Mác – Lênin</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{margin:0;font-family:Segoe UI,Arial;background:#eef2f7}
.container{max-width:950px;margin:40px auto;padding:20px}
.card{background:#fff;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.1);padding:25px}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}
.progress{height:8px;background:#ddd;border-radius:4px;overflow:hidden;width:60%}
.progress-bar{height:100%;background:#2563eb;width:0%}
h2{font-size:20px}
.answer button{
 width:100%;padding:12px;margin:6px 0;border-radius:8px;
 border:1px solid #ddd;background:#f9fafb;font-size:15px;cursor:pointer
}
.answer button:hover{background:#eef2ff}
.correct{background:#16a34a;color:#fff}
.wrong{background:#dc2626;color:#fff}
.nav{display:flex;justify-content:space-between;margin-top:15px}
.nav button{padding:10px 22px;border:none;border-radius:8px;font-size:15px;cursor:pointer}
.prev{background:#e5e7eb}
.next{background:#2563eb;color:#fff}
.result{font-size:22px;text-align:center;font-weight:bold}
.table{margin-top:20px}
.row{display:flex;justify-content:space-between;padding:8px;border-bottom:1px solid #eee}
.ok{color:#16a34a;font-weight:bold}
.no{color:#dc2626;font-weight:bold}
</style>
</head>
<body>

<div class="container">
<div class="card">
  <div class="header">
    <div id="counter"></div>
    <div class="progress"><div class="progress-bar" id="bar"></div></div>
  </div>

  <h2 id="question"></h2>
  <div class="answer" id="answers"></div>

  <div class="nav">
    <button class="prev" onclick="prev()">⬅ Trước</button>
    <button class="next" onclick="next()">Tiếp ➡</button>
  </div>

  <div id="result" class="result"></div>
  <div id="detail" class="table"></div>
</div>
</div>

<script>
const quiz = [
 {q:"Câu 1: Triết học ra đời sớm nhất ở đâu?",a:[
  ["Ấn Độ, Trung Quốc, Hy Lạp",0],
  ["Ai Cập, Hy Lạp, Ấn Độ",0],
  ["Ấn Độ, Châu Phi, Nga",0],
  ["Ai Cập, Ấn Độ, Trung Quốc",1]
 ]},
 {q:"Câu 2: Triết học ra đời từ đâu?",a:[
  ["Từ thực tiễn, do nhu cầu của thực tiễn",1],
  ["Từ suy tư cá nhân",0],
  ["Từ sáng tạo của nhà tư tưởng",0],
  ["Từ ý muốn chủ quan",0]
 ]}
 // 👉 (giữ nguyên 29 câu như bạn đã có)
];

let i=0,score=0,done=[],history=[];

function load(){
 document.getElementById("counter").innerText=`Câu ${i+1}/${quiz.length}`;
 document.getElementById("bar").style.width=((i+1)/quiz.length*100)+"%";
 document.getElementById("question").innerText=quiz[i].q;
 document.getElementById("result").innerText="";
 const a=document.getElementById("answers");
 a.innerHTML="";
 quiz[i].a.forEach(x=>{
  const b=document.createElement("button");
  b.innerText=x[0];
  b.onclick=()=>choose(b,x[1]);
  a.appendChild(b);
 });
}

function choose(btn,ok){
 if(done[i])return;
 done[i]=true;
 history[i]=ok;
 if(ok){btn.className="correct";score++}
 else btn.className="wrong";
 document.querySelectorAll(".answer button").forEach(b=>b.disabled=true);
}

function next(){
 if(i<quiz.length-1){i++;load();}
 else showResult();
}
function prev(){if(i>0){i--;load();}}

function showResult(){
 document.getElementById("question").innerText="🎉 Hoàn thành bài thi";
 document.getElementById("answers").innerHTML="";
 document.getElementById("result").innerText=`Bạn đúng ${score}/${quiz.length} câu`;
 const d=document.getElementById("detail");
 d.innerHTML="<h3>📊 Thống kê từng câu</h3>";
 quiz.forEach((q,idx)=>{
  d.innerHTML+=`
   <div class="row">
    <div>Câu ${idx+1}</div>
    <div class="${history[idx]?'ok':'no'}">
     ${history[idx]?'✅ Đúng':'❌ Sai'}
    </div>
   </div>`;
 });
}

load();
</script>
</body>
</html>
